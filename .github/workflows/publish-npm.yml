name: Publish @lovedolove/veyra to npm

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (must match package.json and not exist on npm)'
        required: true
        type: string

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm to >=11.15.0 (required for npm stage publish)
        run: npm install -g npm@latest

      - run: npm test

      # Validate tag version matches package.json and is unpublished on npm
      - name: Validate version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          # Determine version from tag or manual input
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="${INPUT_VERSION}"
            echo "Manual dispatch version: ${TAG}"
          else
            TAG="${GITHUB_REF_NAME#v}"
            echo "Tag version: ${TAG}"
          fi

          # Strict SemVer validation: X.Y.Z (no prerelease, no build metadata)
          if ! [[ "${TAG}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version format: ${TAG} (expected X.Y.Z)"
            exit 1
          fi

          # Read package.json safely
          PKG_VERSION=$(node -p "require('./package.json').version")
          PKG_NAME=$(node -p "require('./package.json').name")

          echo "Package version: ${PKG_VERSION}"
          echo "Package name: ${PKG_NAME}"

          if [ "${TAG}" != "${PKG_VERSION}" ]; then
            echo "::error::Version (${TAG}) does not match package.json version (${PKG_VERSION})"
            exit 1
          fi

          # Reliable npm registry check via HTTP status code
          # GET https://registry.npmjs.org/@lovedolove/veyra/0.1.59
          # 200 = version exists (block)
          # 404 = version not found (proceed)
          # Other = network/auth/registry error (fail closed)
          REGISTRY_URL="https://registry.npmjs.org/${PKG_NAME}/${TAG}"
          echo "Checking npm registry: ${REGISTRY_URL}"

          HTTP_STATUS=$(curl -sS -w '%{http_code}' --max-time 30 "${REGISTRY_URL}" -o /dev/null 2>&1) || CURL_EXIT=$?

          if [ -n "${CURL_EXIT:-}" ]; then
            echo "::error::npm registry query failed (curl exit: ${CURL_EXIT}, http status: ${HTTP_STATUS})"
            exit 1
          fi

          case "${HTTP_STATUS}" in
            200)
              echo "::error::Version ${TAG} already exists on npm registry (HTTP 200)"
              exit 1
              ;;
            404)
              echo "Version ${TAG} not found on npm (HTTP 404) - proceeding with publish"
              ;;
            *)
              echo "::error::npm registry returned unexpected HTTP status: ${HTTP_STATUS}"
              exit 1
              ;;
          esac

          echo "version=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "Version validation passed: ${TAG}"

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}