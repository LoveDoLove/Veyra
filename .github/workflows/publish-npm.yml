name: Publish @lovedolove/veyra to npm

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm to >=11.15.0 (required for npm stage publish)
        run: npm install -g npm@latest

      - run: npm test

      # Validate tag version matches package.json and is unpublished on npm
      - name: Validate version
        id: version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          PKG_NAME="$(node -p "require('./package.json').name")"

          echo "Tag version: ${TAG}"
          echo "Package version: ${PKG_VERSION}"

          if [ "${TAG}" != "${PKG_VERSION}" ]; then
            echo "::error::Tag version (${TAG}) does not match package.json version (${PKG_VERSION})"
            exit 1
          fi

          if npm view "${PKG_NAME}@${TAG}" version >/dev/null 2>&1; then
            echo "::error::Version ${TAG} already exists on npm registry"
            exit 1
          fi

          echo "version=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "Version validation passed: ${TAG}"

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}