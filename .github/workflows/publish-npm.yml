name: Publish @lovedolove/veyra to npm

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (must match package.json and not exist on npm)'
        required: true
        type: string

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm to >=11.15.0 (required for npm stage publish)
        run: npm install -g npm@latest

      - run: npm test

      # Validate tag version matches package.json and is unpublished on npm
      - name: Validate version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          # Determine version from tag or manual input
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="${INPUT_VERSION}"
            echo "Manual dispatch version: ${TAG}"
          else
            TAG="${GITHUB_REF_NAME#v}"
            echo "Tag version: ${TAG}"
          fi

          # Strict SemVer validation: X.Y.Z (no prerelease, no build metadata)
          if ! [[ "${TAG}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version format: ${TAG} (expected X.Y.Z)"
            exit 1
          fi

          PKG_VERSION="$(node -p \"require('./package.json').version\")"
          PKG_NAME="$(node -p \"require('./package.json').name\")"

          echo "Package version: ${PKG_VERSION}"

          if [ "${TAG}" != "${PKG_VERSION}" ]; then
            echo "::error::Version (${TAG}) does not match package.json version (${PKG_VERSION})"
            exit 1
          fi

          # Safe npm version check: distinguish "not found" from errors
          # npm view returns exit code 0 if found, 1 if not found (ENOENT), other codes for errors
          npm view "${PKG_NAME}@${TAG}" version >/dev/null 2>&1
          NPM_EXIT=$?
          if [ ${NPM_EXIT} -eq 0 ]; then
            echo "::error::Version ${TAG} already exists on npm registry"
            exit 1
          elif [ ${NPM_EXIT} -ne 1 ]; then
            echo "::error::npm registry query failed (exit code ${NPM_EXIT}). Aborting for safety."
            exit 1
          fi
          # Exit code 1 = version not found (ENOENT) - this is what we want

          echo "version=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "Version validation passed: ${TAG}"

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}